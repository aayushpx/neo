; PlatformIO Project Configuration File
[platformio]
default_envs = emulator

[env]
platform = espressif32@6.12.0
board = lilygo-t-display
framework = espidf
build_flags = -ffast-math -O3
monitor_speed = 115200
upload_speed = 921600
lib_deps = https://github.com/a159x36/TDisplayGraphics.git@^2.1.0
board_build.partitions = partitions.csv

[env:tdisplay]

[env:tdisplay_s3]
board = lilygo-t-display-s3
build_flags = -ffast-math -O3 -DTTGO_S3 -DBOARD_HAS_PSRAM

[env:emulator]
platform_packages = ttgo-tdisplay-emulator@^5.1.0
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/ttgo-tdisplay-emulator/emulate $SOURCE

[env:emulator_s3]
board = lilygo-t-display-s3
build_flags = -ffast-math -O3 -DTTGO_S3 -DBOARD_HAS_PSRAM
platform_packages = ttgo-tdisplay-emulator@^5.1.0
upload_protocol = custom
upload_command = $PROJECT_PACKAGES_DIR/ttgo-tdisplay-emulator/emulate $SOURCE s3